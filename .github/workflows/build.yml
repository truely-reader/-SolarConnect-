name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'

      - name: Fix Groovy Bug
        run: |
          FILE=$(find /opt/hostedtoolcache -name "flutter.groovy" | head -n 1)
          echo "Patching $FILE"
          sed -i 's/import groovy.xml.QName//g' "$FILE"
          sed -i 's/QName//g' "$FILE"

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SolarConnect-APK
          path: build/app/outputs/flutter-apk/app-debug.apk